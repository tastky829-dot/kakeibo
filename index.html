  function renderPage(p) {

    var ver = S.version, data = currentPayload(), payload = K.payloadString(data);
    return sha256Hex(payload).then(function (hash) {
      var obj = K.buildBackup(data, { appVersion: APP_VERSION, exportedAt: nowISO(), checksum: hash ? 'sha256:' + hash : null });
      prepared = { version: ver, text: JSON.stringify(obj), name: 'kakeibo-backup-' + stamp() + '.json', count: data.transactions.length };
      return prepared;
    });
  }
  function doBackup() {
    var go = function (p) {
      return saveFile(p.name, p.text, 'application/json').then(function (res) {
        if (res === 'saved') {
          return saveMeta({ lastBackupAt: nowISO() }).then(function () {
            S.ui.dirty.home = true; S.ui.dirty.settings = true; refreshPages(); renderActive();
            toast('バックアップを保存しました（明細 ' + p.count + '件）');
          });
        }
        if (res === 'retry') {
          return alertDialog({ title: 'バックアップの準備ができました', message: '「保存する」を押して、保存先を選んでください。', buttons: [{ label: 'キャンセル', value: false, style: 'cancel' }, { label: '保存する', value: true, style: 'default' }] })
            .then(function (ok) { if (ok) return go(p); });
        }
      });
    };
    var run = (prepared && prepared.version === S.version) ? go(prepared) : prepareBackup().then(go);
    run.catch(function (e) { alertDialog({ title: 'バックアップを保存できませんでした', message: esc((e && e.message) || '') }); });
  }
  function doCSV(p) {
    var rg = csvRange(p.state);
    if (rg.from > rg.to) return;
    var list = K.filterRange(S.tx, rg.from, rg.to);
    var text = K.toCSV(list, lookups());
    saveFile('kakeibo-' + rg.name + '-' + stamp() + '.csv', text, 'text/csv').then(function (res) {
      if (res === 'saved') toast('CSVを保存しました（' + list.length + '件）');
      if (res === 'retry') alertDialog({ title: 'CSVの準備ができました', buttons: [{ label: 'キャンセル', value: false, style: 'cancel' }, { label: '保存する', value: true }] }).then(function (ok) { if (ok) doCSV(p); });
    }).catch(function (e) { alertDialog({ title: 'CSVを保存できませんでした', message: esc((e && e.message) || '') }); });
  }

  /* ---- 復元 ---- */
  function readFileText(file) {
    if (file.text) return file.text();
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsText(file);
    });
  }
  function startRestore(file) {
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) { alertDialog({ title: '復元できません', message: 'ファイルが大きすぎます。' }); return; }
    readFileText(file).then(function (text) {
      var obj;
      try { obj = JSON.parse(String(text).replace(/^﻿/, '')); } catch (e) {
        alertDialog({ title: '復元できません', message: 'ファイルの形式が正しくありません。この家計簿で保存したバックアップファイル（.json）を選んでください。' });
        return;
      }
      var v = K.validateBackup(obj);
      if (!v.ok) { alertDialog({ title: '復元できません', message: esc(v.errors.join('\n')) }); return; }
      var check = (obj.checksum && typeof obj.checksum === 'string' && obj.checksum.indexOf('sha256:') === 0) ? sha256Hex(K.payloadString(obj.data)) : Promise.resolve(null);
      return check.then(function (hash) {
        if (hash && 'sha256:' + hash !== obj.checksum) {
          alertDialog({ title: '復元を中止しました', message: 'ファイルが壊れているか、内容が書き換えられています。別のバックアップファイルをお試しください。' });
          return;
        }
        var s = v.summary;
        var msg = '<b>' + (s.exportedAt ? esc(fmtDateTime(s.exportedAt)) + ' に保存' : '保存日時不明') + '</b><br>明細 ' + s.transactions + '件' +
          (s.firstDate ? '（' + esc(s.firstDate.replace(/-/g, '/')) + '〜' + esc(s.lastDate.replace(/-/g, '/')) + '）' : '') + '<br>定期収支 ' + s.recurring + '件・カテゴリー ' + s.categories + '件' +
          (v.warnings.length ? '<br><span class="warn-text">' + v.warnings.map(esc).join('<br>') + '</span>' : '') +
          '<br><br><b>置き換え</b>：今のデータを消して、バックアップの内容にします。<br><b>統合</b>：今のデータを残したまま、バックアップにしか無い明細を追加します。';
        return alertDialog({ title: 'バックアップから復元', message: msg, buttons: [
          { label: '置き換えて復元', value: 'replace', style: 'destructive' },
          { label: '今のデータに統合', value: 'merge', style: 'default' },
          { label: 'キャンセル', value: null, style: 'cancel' }] }).then(function (choice) {
          if (!choice) return;
          return applyRestore(v.data, choice);
        });
      });
    }).catch(function (e) { alertDialog({ title: '復元できませんでした', message: esc((e && e.message) || '') }); });
  }
  function replaceOps(data, keepSnapshot) {
    var ops = [
      { type: 'clear', store: 'transactions' }, { type: 'clear', store: 'categories' },
      { type: 'clear', store: 'methods' }, { type: 'clear', store: 'recurring' }
    ];
    data.categories.forEach(function (c) { ops.push({ type: 'put', store: 'categories', value: c }); });
    data.methods.forEach(function (m) { ops.push({ type: 'put', store: 'methods', value: m }); });
    data.recurring.forEach(function (r) { ops.push({ type: 'put', store: 'recurring', value: r }); });
    data.transactions.forEach(function (t) { ops.push({ type: 'put', store: 'transactions', value: t }); });
    ops.push(kvOp('budgets', data.budgets));
    ops.push(kvOp('settings', data.settings));
    if (keepSnapshot) ops.push(kvOp('snapshot', keepSnapshot));
    return ops;
  }
  function applyRestore(data, mode) {
    var snap = { createdAt: nowISO(), reason: mode === 'replace' ? '復元（置き換え）' : '復元（統合）', data: currentPayload() };
    var target = data, stats = null;
    if (mode === 'merge') {
      var m = K.mergeData(currentPayload(), data);
      target = m.data; stats = m.stats;
    }
    var ops = replaceOps(target, snap);
    ops.push(kvOp('meta', Object.assign({}, S.meta, { sampleBudget: false })));
    return commit(ops).then(loadAll).then(function () {
      applyTheme(); applyFabSide();
      S.ui.hist.period = null; S.ui.cal.month = null; S.ui.ana.period = null;
      afterChange();
      return runRecurring();
    }).then(function () {
      toast(mode === 'replace' ? '復元しました（明細 ' + S.tx.length + '件）' : '統合しました（追加 ' + stats.addedTx + '件・重複のため除外 ' + stats.skippedTx + '件）', { duration: 5000 });
    });
  }
  function restoreSnapshot() {
    var snap = S.snapshot;
    if (!snap || !snap.data) return;
    alertDialog({ title: '前の状態に戻しますか？', message: esc(fmtDateTime(snap.createdAt)) + '（' + esc(snap.reason || '') + 'の直前）の状態に戻します。今のデータは置き換えられます。',
      buttons: [{ label: 'キャンセル', value: false, style: 'cancel' }, { label: '戻す', value: true, style: 'destructive' }] }).then(function (ok) {
      if (!ok) return;
      var v = K.validateBackup({ app: K.APP_ID, format: K.BACKUP_FORMAT, data: snap.data });
      if (!v.ok) { alertDialog({ title: '戻せませんでした', message: esc(v.errors.join('\n')) }); return; }
      var ops = replaceOps(v.data, null);
      ops.push({ type: 'delete', store: 'kv', key: 'snapshot' });
      return commit(ops).then(loadAll).then(function () { applyTheme(); applyFabSide(); afterChange(); toast('前の状態に戻しました'); });
    });
  }

  function deleteCategory(c) {
    var usedTx = S.tx.filter(function (t) { return t.categoryId === c.id; });
    var usedRules = S.rules.filter(function (r) { return r.categoryId === c.id; });
    var others = S.cats.filter(function (x) { return x.type === c.type && x.id !== c.id; });
    if (!others.length) { alertDialog({ title: '削除できません', message: (c.type === 'expense' ? '支出' : '収入') + 'のカテゴリーは1つ以上必要です。' }); return; }
    var budgetOps = function () {
      var b = JSON.parse(JSON.stringify(S.budgets));
      delete b.default.cats[c.id];
      Object.keys(b.months).forEach(function (k) { delete b.months[k].cats[c.id]; });
      return [kvOp('budgets', b)];
    };
    if (!usedTx.length && !usedRules.length) {
      alertDialog({ title: '「' + esc(c.name) + '」を削除しますか？', message: 'このカテゴリーの明細はありません。', buttons: [{ label: 'キャンセル', value: false, style: 'cancel' }, { label: '削除', value: true, style: 'destructive' }] }).then(function (ok) {
        if (!ok) return;
        commit([{ type: 'delete', store: 'categories', key: c.id }].concat(budgetOps())).then(loadAll).then(function () { afterChange(); toast('カテゴリーを削除しました'); });
      });
      return;
    }
    var visible = others.filter(function (x) { return !x.hidden; });
    var to = fallbackCategoryId(c.type);
    var opts = (visible.length ? visible : others).map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === fallbackCategoryId(c.type) ? ' selected' : '') + '>' + esc(x.icon + ' ' + x.name) + '</option>'; }).join('');
    alertDialog({
      title: '「' + esc(c.name) + '」は使用中です',
      message: '明細 ' + usedTx.length + '件' + (usedRules.length ? '・定期収支 ' + usedRules.length + '件' : '') + 'で使われています。削除する場合は、移動先のカテゴリーを選んでください。入力画面から隠すだけなら「非表示」が便利です（過去の明細はそのまま残ります）。',
      extra: '<label class="field"><span>移動先</span><select id="move-to">' + opts + '</select></label>',
      buttons: [{ label: '移動して削除', value: 'move', style: 'destructive', check: function (w) { var sel = w.querySelector('#move-to'); if (sel) to = sel.value; return true; } },

    }).then(function (choice) {
      if (choice === 'hide') {
        if (!c.hidden && visibleCats(c.type).length <= 1) { alertDialog({ title: '非表示にできません', message: '表示中のカテゴリーが1つ以上必要です。' }); return; }
        commit([{ type: 'put', store: 'categories', value: Object.assign({}, c, { hidden: true }) }]).then(loadAll).then(function () { afterChange(); toast('非表示にしました'); });
      } else if (choice === 'move') {
        var now = nowISO();
        var ops = usedTx.map(function (t) { return { type: 'put', store: 'transactions', value: Object.assign({}, t, { categoryId: to, updatedAt: now }) }; });
        usedRules.forEach(function (r) { ops.push({ type: 'put', store: 'recurring', value: Object.assign({}, r, { categoryId: to }) }); });
        ops.push({ type: 'delete', store: 'categories', key: c.id });

      S.ui.hist.period = null; S.ui.ana.period = null; S.ui.ana.year = null; S.ui.ana.from = null; S.ui.ana.to = null;
      Object.keys(S.ui.dirty).forEach(function (k) { S.ui.dirty[k] = true; });
      renderActive(); closePage(); toast('月の開始日を保存しました');
    });
  };
  A['backup-save'] = function () { doBackup(); };
  A['snapshot-restore'] = function () { restoreSnapshot(); };
  A['csv-save'] = function () { var p = topPage(); if (p) doCSV(p); };
  A['trash-restore'] = function (el) { restoreTrash(el.getAttribute('data-id')).then(function (t) { if (t) toast('明細を元に戻しました'); }); };
  A['trash-empty'] = function () {
    alertDialog({ title: 'ゴミ箱を空にしますか？', message: S.trash.length + '件の明細を完全に削除します。元に戻せません。', buttons: [{ label: 'キャンセル', value: false, style: 'cancel' }, { label: '完全に削除', value: true, style: 'destructive' }] })
      .then(function (ok) { if (ok) purgeTrash(S.trash.map(function (t) { return t.id; })).then(function () { toast('ゴミ箱を空にしました'); }); });
  };
  A.wipe = function () { wipeAll(); };

  var CHANGE = {};
  CHANGE['ana-from'] = function (el) { if (K.isValidYMD(el.value)) { S.ui.ana.from = el.value; S.ui.dirty.analysis = true; renderActive(); } };
  CHANGE['ana-to'] = function (el) { if (K.isValidYMD(el.value)) { S.ui.ana.to = el.value; S.ui.dirty.analysis = true; renderActive(); } };
  CHANGE['period-day'] = function (el) { var p = topPage(); if (p) { p.state.day = K.clampStartDay(el.value); renderPage(p); } };
  CHANGE['csv-from'] = function (el) { var p = topPage(); if (p && K.isValidYMD(el.value)) { p.state.from = el.value; renderPage(p); } };
  CHANGE['csv-to'] = function (el) { var p = topPage(); if (p && K.isValidYMD(el.value)) { p.state.to = el.value; renderPage(p); } };
  CHANGE['restore-file'] = function (el) { var f = el.files && el.files[0]; el.value = ''; startRestore(f); };
  CHANGE['backup-reminder'] = function (el) { saveSettings({ backupReminderDays: parseInt(el.value, 10) }); };
  var INPUT = {};
  var histTimer = null;
  INPUT['hist-query'] = function (el) {
    clearTimeout(histTimer);
    histTimer = setTimeout(function () {
      S.ui.hist.query = el.value; S.ui.hist.limit = 200;
      var box = $('#hist-results');
      if (box) box.innerHTML = historyResultsHTML();
    }, 220);
  };
  INPUT['bud-amount'] = function (el) {
    var p = topPage(); if (!p) return;
    var d = digitsOnly(el.value).slice(0, 9);
    var n = d ? parseInt(d, 10) : null;
    var k = el.getAttribute('data-k');
    if (k === '__total__') p.state.form.total = n || null; else p.state.form.cats[k] = n || null;
    var pos = el.value.length - (el.selectionStart || el.value.length);
    el.value = n ? K.formatNum(n) : '';
    try { var np = Math.max(0, el.value.length - pos); el.setSelectionRange(np, np); } catch (e) { /* noop */ }
  };

  function bindEvents() {
    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-action]');
      if (!el || el.disabled) return;
      if (el.closest('#dialog-root')) return;
      var fn = A[el.getAttribute('data-action')];
      if (fn) { ev.preventDefault(); fn(el, ev); }
    });
    document.addEventListener('change', function (ev) {
      var el = ev.target.closest('[data-change]');
      if (!el) return;
      var fn = CHANGE[el.getAttribute('data-change')];
      if (fn) fn(el, ev);
    });
    document.addEventListener('input', function (ev) {
      var el = ev.target.closest('[data-input]');
      if (!el) return;
      var fn = INPUT[el.getAttribute('data-input')];
      if (fn) fn(el, ev);
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        var dl = $$('#dialog-root .dlg-wrap');
        if (dl.length) return;
        if (E) { tryCloseEntry(); return; }
        if (pageStack.length) closePage();
      }
    });
    var resizeTimer = null, lastW = window.innerWidth;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        if (Math.abs(window.innerWidth - lastW) < 20) return;
        lastW = window.innerWidth;
        S.ui.dirty.analysis = true; S.ui.dirty.home = true; renderActive();
      }, 200);
    });
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') onResume(); });
    window.addEventListener('pageshow', function (ev) { if (ev.persisted) onResume(); });
    window.addEventListener('online', function () { S.env.online = true; });
    window.addEventListener('offline', function () { S.env.online = false; });
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onMq = function () { applyTheme(); S.ui.dirty.analysis = true; renderActive(); };
      if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
    }
    setInterval(checkDayChange, 60000);
  }
  function checkDayChange() {
    var t = K.todayYMD();
    if (t !== S.today) {
      S.today = t;
      Object.keys(S.ui.dirty).forEach(function (k) { S.ui.dirty[k] = true; });
      runRecurring().then(function () { renderActive(); });
    }
  }
  function onResume() {
    checkDayChange();
    if (swReg && navigator.onLine !== false) { try { swReg.update().catch(noop); } catch (e) { /* noop */ } }
  }

  /* ================= Service Worker（オフライン対応） ================= */
  var swReg = null;
  function setupSW() {
    if (!('serviceWorker' in navigator)) { S.env.swState = 'unsupported'; return; }
    if (S.env.iframe || !window.isSecureContext) { S.env.swState = 'unsupported'; return; }
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
      swReg = reg; S.env.swState = 'registered';
      checkOffline();
      navigator.serviceWorker.ready.then(function () { setTimeout(checkOffline, 500); });
    }).catch(function () { S.env.swState = 'error'; });
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController) {
        toast('アプリが新しいバージョンに更新されました', { action: '再読み込み', duration: 12000, onAction: function () { location.reload(); } });
      }
      hadController = true;
      checkOffline();
    });
  }
  function checkOffline() {
    try {
      if (!window.caches || !navigator.serviceWorker || !navigator.serviceWorker.controller) { S.env.offlineReady = false; return; }
      caches.match('./index.html', { ignoreSearch: true }).then(function (r) {
        var ready = !!r;
        if (ready !== S.env.offlineReady) { S.env.offlineReady = ready; S.ui.dirty.settings = true; if (S.ui.tab === 'settings') renderActive(); refreshPages(); }
      }).catch(noop);
    } catch (e) { /* noop */ }
  }

  /* ================= 起動 ================= */
  function start() {
    detectEnv();
    applyTheme();
    buildShell();
    bindEvents();
    setupSwipe();
    setupChannel();
    setupClaudeDownloads();
    DB.setVersionChangeHandler(function () { toast('アプリが更新されました。再読み込みしてください', { action: '再読み込み', duration: 15000, onAction: function () { location.reload(); } }); });
    $('#tab-home').innerHTML = '<div class="loading">読み込み中…</div>';
    DB.init().then(function (res) {
      S.storage.mode = res.mode; S.storage.reason = res.reason || '';
      return loadAll();
    }).then(seedIfNeeded).then(function () {
      applyTheme(); applyFabSide();
      if (S.env.iframe && !S.meta.previewSeeded && !S.tx.length) {
        return saveMeta({ previewSeeded: true }).then(addSampleData);
      }
    }).then(function () {
      return autoPurgeTrash();
    }).then(function () {
      Object.keys(S.ui.dirty).forEach(function (k) { S.ui.dirty[k] = true; });
      renderActive();
      return runRecurring();
    }).then(function (n) {
      if (n) toast('固定費・定期収入を ' + n + '件 自動登録しました');
      if (S.tx.length) maybePersist();
      document.body.classList.add('ready');
    }).catch(function (e) {
      console.error(e);
      $('#tab-home').innerHTML = '<div class="card"><h2>起動できませんでした</h2><p>' + esc((e && (e.message || e.name)) || '') + '</p><button class="btn" onclick="location.reload()">再読み込み</button></div>';
    });
    setupSW();
  }

  // テスト用の窓口（データの中身は外部に出しません）
  window.KakeiboApp = {
    version: APP_VERSION,
    state: function () { return S; },
    runRecurring: runRecurring,
    reload: function () { return loadAll().then(function () { afterChange(true); }); }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
}());

</script>
</body>
</html>
