  color-scheme: light;
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --elev: #FFFFFF;
  --sheet: #F2F2F7;
  --label: #111114;
  --label2: #5E5E66;
  --label3: #8E8E95;
  --sep: rgba(60,60,67,0.18);
  --fill: rgba(118,118,128,0.12);
  --fill2: rgba(118,118,128,0.22);
  --seg-on: #FFFFFF;
  --accent: #007AFF;
  --accent-weak: rgba(0,122,255,0.12);
  --on-accent: #FFFFFF;
  --income: #2A78D6;
  --expense: #EB6834;
  --income-text: #1D63B8;
  --expense-text: #B8461A;
  --pos: #1B7F3B;
  --neg: #C9302C;
  --warn: #FAB219;
  --warn-text: #8A5A00;
  --warn-bg: rgba(250,178,25,0.17);
  --danger: #D03B3B;
  --danger-text: #C62828;
  --danger-bg: rgba(208,59,59,0.10);
  --info-bg: rgba(0,122,255,0.08);
  --grid: #E9E9EE;
  --axis: #C7C7CC;
  --rest: #C4C4CA;
  --tabbar: rgba(248,248,250,0.88);
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 12px rgba(0,0,0,0.04);
  --key-bg: #FFFFFF;
  --key-fn: #DCDCE1;
  --key-shadow: rgba(0,0,0,0.13);
  --backdrop: rgba(0,0,0,0.32);
  --toast-bg: rgba(28,28,30,0.95);
}
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #000000;
  --card: #1C1C1E;
  --elev: #2C2C2E;
  --sheet: #161618;
  --label: #F2F2F7;
  --label2: #AEAEB4;
  --label3: #7C7C83;

  --warn: #FAB219;
  --warn-text: #FFC64D;
  --warn-bg: rgba(250,178,25,0.18);
  --danger: #E5484D;
  --danger-text: #FF6B6B;
  --danger-bg: rgba(255,69,58,0.18);
  --info-bg: rgba(10,132,255,0.16);
  --grid: #2C2C2E;
  --axis: #48484A;
  --rest: #5A5A60;
  --tabbar: rgba(22,22,24,0.88);
  --shadow: none;
  --key-bg: #3A3A3C;
  --key-fn: #2C2C2E;
  --key-shadow: rgba(0,0,0,0.6);
  --backdrop: rgba(0,0,0,0.56);

:root {
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", sans-serif;
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--label);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  overscroll-behavior: none; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
[data-action], [data-key] { cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }
select { -webkit-appearance: none; appearance: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:focus:not(:focus-visible) { outline: none; }
.ic { width: 22px; height: 22px; flex: none; }
#app { position: fixed; inset: 0; overflow: hidden; }

/* ---------- タブの画面 ---------- */
.tabview {
  position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding: calc(env(safe-area-inset-top) + 14px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 160px) max(16px, env(safe-area-inset-left));
}
.tabview > * { max-width: 608px; margin-left: auto; margin-right: auto; }
.head { margin: 2px auto 14px; }
.head h1 { font-size: 30px; line-height: 1.2; font-weight: 800; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.head-date { margin: 0 0 2px; font-size: 13px; color: var(--label2); font-weight: 600; }
.head-sub { margin: 2px 0 0; color: var(--label2); font-size: 14px; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.loading { text-align: center; padding: 80px 0; color: var(--label2); }

/* ---------- カード ---------- */
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card.flush { padding: 0; overflow: hidden; }
.card.tap { transition: transform .15s; }
.card.tap:active { transform: scale(.985); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; min-height: 28px; }
.card-head h2 { font-size: 17px; font-weight: 700; margin: 0; }
.chev { width: 18px; height: 18px; color: var(--label3); }
.k { font-size: 13px; color: var(--label2); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.v { font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.hero { font-size: 38px; line-height: 1.15; letter-spacing: -.01em; font-variant-numeric: normal; }
.v.big { font-size: 28px; line-height: 1.2; }
.income { color: var(--income-text); }
.expense, .expense-t { color: var(--expense-text); }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.muted { color: var(--label2); font-size: 14px; margin: 0; }
.small { font-size: 13px; }
.center { text-align: center; }
.hint { font-size: 13px; color: var(--label2); margin: 8px 0 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.hint .ic { width: 16px; height: 16px; }
.ok-ic { color: var(--pos); }
.warn-ic { color: var(--warn-text); }
.muted-ic { color: var(--label3); }
.warn-text { color: var(--warn-text); font-size: 13px; }
.danger-text { color: var(--danger-text) !important; }
.ldot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.ldot.income { background: var(--income); }
.ldot.expense { background: var(--expense); }
.ldot.blank { background: transparent; }
.sign-dot { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; line-height: 1; color: #fff; font-weight: 800; }
.sign-dot.pos { background: var(--pos); }
.sign-dot.neg { background: var(--neg); }

/* 収支サマリー */
.summary .sum-main { display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px; border-bottom: .5px solid var(--sep); }
.sum-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 12px; }
.sum-sub > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sum-sub .v { font-size: clamp(17px, 5vw, 21px); }

/* 予算 */
.budget-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.budget-top > div { display: flex; flex-direction: column; }
.budget-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; }
.meter { height: 8px; border-radius: 4px; background: var(--accent-weak); overflow: hidden; margin: 10px 0 6px; }
.meter > span { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s; }
.meter.warn { background: var(--warn-bg); }
.meter.warn > span { background: var(--warn); }
.meter.over { background: var(--danger-bg); }
.meter.over > span { background: var(--danger); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; flex: none; }
.chip .ic { width: 13px; height: 13px; }
.chip.warn { background: var(--warn-bg); color: var(--warn-text); }
.chip.danger { background: var(--danger-bg); color: var(--danger-text); }
.alert-line { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; margin: 8px 0 0; }
.alert-line .ic { width: 18px; height: 18px; }
.alert-line.warn { color: var(--warn-text); }
.alert-line.danger { color: var(--danger-text); }
.mini-list { list-style: none; margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; border-top: .5px solid var(--sep); padding: 10px 0 0; }
.mini-list li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.mini-list .name { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-list .val { font-size: 12px; color: var(--label2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 前月比較 */
.compare-main { margin: 0; font-size: 15px; line-height: 1.55; }
.compare-main b { font-size: 22px; }
.compare-main .pct { font-size: 14px; color: var(--label2); margin-left: 4px; }
.cmp-bars { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.cmp-row { display: grid; grid-template-columns: 2.6em 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
.cmp-track { height: 10px; background: var(--fill); border-radius: 5px; overflow: hidden; }
.cmp-track span { display: block; height: 100%; border-radius: 5px; }
.cmp-track .cur { background: var(--expense); }
.cmp-track .prev { background: var(--rest); }
.cmp-row .v { font-size: 13px; font-weight: 600; }

/* 割合バー・凡例 */
.segbar { display: flex; gap: 2px; height: 28px; }
.segbar span { display: flex; align-items: center; padding-left: 6px; min-width: 3px; border-radius: 4px; overflow: hidden; }
.segbar em { font-style: normal; font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; }
.segbar em.dark { color: #111; }
.legend-list { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
.legend-list li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.legend-list .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-list .val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.legend-list .pct { color: var(--label2); font-variant-numeric: tabular-nums; width: 3em; text-align: right; flex: none; }
.legend-list.compact { flex: 1; min-width: 130px; margin: 0; }

/* ---------- お知らせ ---------- */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.55; }
.banner .ic { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.banner.info { background: var(--info-bg); }
.banner.info > .ic { color: var(--accent); }
.banner.warn { background: var(--warn-bg); }
.banner.warn > .ic { color: var(--warn-text); }
.banner.danger { background: var(--danger-bg); }
.banner.danger > .ic { color: var(--danger-text); }
.banner p { margin: 0; }
.banner-body { flex: 1; min-width: 0; }
.banner-actions { display: flex; gap: 18px; margin-top: 6px; }
.btn-text { color: var(--accent); font-weight: 700; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; }
.btn-text.muted { color: var(--label2); }
.welcome h2 { margin: 0 0 6px; font-size: 19px; }
.welcome p { margin: 0; font-size: 15px; line-height: 1.65; color: var(--label2); }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 16px; border-radius: 13px; background: var(--card); color: var(--accent); font-weight: 700; font-size: 16px; box-shadow: var(--shadow); flex-wrap: wrap; text-align: center; }
.card .btn { background: var(--fill); box-shadow: none; }
.btn.primary, .card .btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.btn.wide { width: 100%; }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 14px; flex: none; }
.btn .ic { width: 20px; height: 20px; }
.btn:active { opacity: .7; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn small { display: block; width: 100%; font-size: 12px; color: var(--label2); font-weight: 500; }
.row-gap { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.icon-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 14px; font-weight: 700; min-height: 40px; padding: 0 4px; }
.icon-btn .ic { width: 20px; height: 20px; }
.chip-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; min-height: 36px; border-radius: 999px; background: var(--fill); font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; }
.chip-btn.on { background: var(--accent-weak); color: var(--accent); }
.chip-btn .ic { width: 16px; height: 16px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 16px; }

/* セグメント */
.seg { display: inline-flex; background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { flex: 1; min-height: 34px; padding: 4px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--label); white-space: nowrap; text-align: center; }
.seg button.on { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.seg.small button { min-height: 30px; padding: 2px 10px; font-size: 13px; }
.mode-row, .seg-wrap { margin: 0 auto 12px; }
.mode-row .seg, .seg-wrap .seg { display: flex; width: 100%; }

/* 月の切替 */
.switcher { display: flex; align-items: stretch; gap: 8px; margin: 0 auto 12px; }
.sw-btn { width: 46px; min-height: 46px; border-radius: 13px; background: var(--card); display: grid; place-items: center; color: var(--accent); flex: none; box-shadow: var(--shadow); }
.sw-btn .ic { width: 22px; height: 22px; }
.sw-center { flex: 1; min-height: 46px; background: var(--card); border-radius: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 8px; box-shadow: var(--shadow); text-align: center; }
.sw-center b { font-size: 17px; line-height: 1.3; }
.sw-center small { font-size: 12px; color: var(--label2); line-height: 1.3; }
.sw-center small.link { color: var(--accent); font-weight: 700; }
.sw-center.static { cursor: default; }

/* ---------- 明細リスト ---------- */
.tx-list { display: flex; flex-direction: column; }
.tx-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0; min-height: 58px; position: relative; }
.card.flush .tx-row { padding: 10px 14px; }
.tx-row + .tx-row { border-top: .5px solid var(--sep); }
.tx-row:active { background: var(--fill); }
.cat-ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; line-height: 1; flex: none; background: var(--fill); background: color-mix(in srgb, var(--c) 18%, transparent); }
.cat-ic.sm { width: 26px; height: 26px; font-size: 14px; }
.cat-ic.lg { width: 68px; height: 68px; font-size: 36px; }
.tx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tx-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.tx-sub { font-size: 13px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-amt.expense { color: var(--label); }
.tx-amt.income { color: var(--income-text); }
.badge { font-size: 11px; font-weight: 600; color: var(--label2); background: var(--fill); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.day-group { margin-bottom: 14px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 4px 6px; font-size: 13px; font-weight: 700; color: var(--label2); }
.day-head.big { font-size: 15px; color: var(--label); }
.day-tot { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
.count-line { font-size: 12.5px; color: var(--label3); margin: 0 4px 8px; }
.empty { text-align: center; color: var(--label2); padding: 36px 16px; }
.empty .ic { width: 40px; height: 40px; color: var(--label3); }
.empty.small { padding: 20px 16px; }

/* 検索・絞り込み */
.search-box { display: flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 12px; padding: 0 12px; height: 44px; margin: 0 0 10px; }
.search-box .ic { width: 18px; height: 18px; color: var(--label2); }
.search-box input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; height: 100%; -webkit-appearance: none; appearance: none; }
.filter-row { display: flex; gap: 8px; align-items: center; margin: 0 auto 8px; }
.filter-row .seg { flex: 1; display: flex; }
.scope-row { margin: 0 auto 4px; }
.active-filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px auto; }
.sum-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--card); border-radius: 14px; padding: 10px 12px; margin: 8px 0 12px; box-shadow: var(--shadow); }
.sum-strip > div { display: flex; flex-direction: column; min-width: 0; }
.sum-strip .k { font-size: 12px; }
.sum-strip .v { font-size: clamp(13px, 3.9vw, 15.5px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- カレンダー ---------- */
.head-nav { display: flex; align-items: center; gap: 8px; }
.sw-btn.sm { width: 40px; min-height: 40px; height: 40px; border-radius: 12px; }
.cal-card { padding: 10px 6px 8px; overflow: hidden; }
.cal-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 700; color: var(--label2); margin-bottom: 4px; }
.cal-week .sun, .cal-day.sun .num { color: var(--neg); }
.cal-week .sat, .cal-day.sat .num { color: var(--income-text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-day { min-height: 60px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 4px 0; gap: 1px; min-width: 0; text-align: center; }
.cal-day .num { font-size: 14px; font-weight: 600; width: 26px; height: 26px; line-height: 26px; border-radius: 50%; text-align: center; }
.cal-day.today .num { background: var(--accent); color: #fff !important; }
.cal-day.sel { background: var(--accent-weak); }
.cal-day.future .num { opacity: .55; }
.cal-day .exp { font-size: 10.5px; font-weight: 700; color: var(--label); font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; letter-spacing: -.02em; }
.cal-day .inc { font-size: 10px; font-weight: 700; color: var(--income-text); line-height: 1.25; white-space: nowrap; letter-spacing: -.02em; }
.cal-tip { text-align: center; font-size: 12px; color: var(--label3); margin: 6px 0 0; }
.slide-l { animation: slideL .24s ease; }
.slide-r { animation: slideR .24s ease; }
@keyframes slideL { from { transform: translateX(28px); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-28px); opacity: .2; } to { transform: none; opacity: 1; } }
.day-detail { margin-top: 6px; }
.day-detail .btn { margin-top: 10px; }

/* ---------- 分析 ---------- */
.stat-rows { display: flex; flex-direction: column; gap: 0; }
.stat-row { display: grid; grid-template-columns: 4.2em 1fr auto; align-items: center; gap: 8px; padding: 8px 0; }
.stat-row + .stat-row { border-top: .5px solid var(--sep); }
.stat-row .v { font-size: clamp(17px, 5vw, 20px); white-space: nowrap; }
.delta { font-size: 12.5px; font-weight: 700; color: var(--label2); line-height: 1.3; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta small { display: block; font-size: 12px; font-weight: 600; }
.delta.good { color: var(--pos); }
.delta.bad { color: var(--neg); }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat3 > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat3 .v { font-size: clamp(14px, 4.2vw, 17px); white-space: nowrap; }
.chart-box { margin: 0 -4px; overflow: hidden; }
.chart { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .axis { fill: var(--label3); font-size: 10.5px; font-variant-numeric: tabular-nums; font-family: var(--font); }
.chart .axis.strong { fill: var(--label); font-weight: 700; }
.chart .bar-inc { fill: var(--income); }
.chart .bar-exp { fill: var(--expense); }
.chart .sel-bg { fill: var(--fill); }
.chart .hit { fill: transparent; }
.chart .line { fill: none; stroke: var(--income); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--income); opacity: .1; }
.chart .dot { fill: var(--income); stroke: var(--card); stroke-width: 2; }
.chart-legend { display: flex; gap: 14px; font-size: 13px; color: var(--label2); margin-bottom: 4px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.pick-line { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.donut-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
.donut { flex: none; }
.donut-k { fill: var(--label2); font-size: 12px; font-weight: 600; font-family: var(--font); }
.donut-v { fill: var(--label); font-size: 17px; font-weight: 800; font-family: var(--font); }
.sub-h { font-size: 14px; color: var(--label2); margin: 18px 0 10px; }
.rank { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.rank-head { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.rank-no { width: 18px; font-size: 13px; color: var(--label3); font-weight: 700; text-align: center; flex: none; }
.rank .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rank .val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank .pct { width: 3.6em; text-align: right; color: var(--label2); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
.hbar { height: 8px; background: var(--fill); border-radius: 4px; margin: 6px 0 0 26px; overflow: hidden; }
.rank.plain .hbar { margin-left: 30px; }
.hbar span { display: block; height: 100%; border-radius: 4px; min-width: 2px; }
.hbar span.accent { background: var(--income); }
.rank-cmp { font-size: 12px; color: var(--label2); margin: 4px 0 0 26px; }
.rank-cmp .delta { display: inline; font-size: 12px; }
.m-ic { width: 22px; text-align: center; font-size: 15px; flex: none; }
.m-ic.big { width: 38px; font-size: 22px; }
.table-wrap { overflow-x: auto; }
.num-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.num-table th { font-weight: 600; color: var(--label2); text-align: right; padding: 6px 4px; border-bottom: .5px solid var(--sep); white-space: nowrap; }
.num-table th:first-child, .num-table td:first-child { text-align: left; }
.num-table td { text-align: right; padding: 7px 4px; border-bottom: .5px solid var(--sep); white-space: nowrap; }
.num-table tr.sel td { background: var(--accent-weak); }
.num-table tr.total td { font-weight: 700; }
.table-view summary { color: var(--accent); font-weight: 700; font-size: 14px; margin-top: 10px; cursor: pointer; }
.table-view[open] summary { margin-bottom: 6px; }
.range-card .range-inputs { margin: 0; }
.range-inputs { display: flex; align-items: flex-end; gap: 8px; }
.range-inputs label, .range-inputs .yen-input { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--label2); font-weight: 600; min-width: 0; }
.range-inputs .yen-input { flex-direction: row; align-items: center; }
.range-inputs input { height: 42px; border: 0; border-radius: 10px; background: var(--fill); padding: 0 8px; width: 100%; min-width: 0; color: var(--label); }
.tilde { padding-bottom: 10px; color: var(--label2); flex: none; }
.preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- 設定 ---------- */
.group { margin: 0 auto 22px; }
.group-h { font-size: 13px; font-weight: 600; color: var(--label2); margin: 0 0 6px 16px; }
.group-foot { font-size: 13px; color: var(--label2); margin: 6px 16px 0; line-height: 1.55; }
.list { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.list-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 14px; text-align: left; position: relative; }
.list-row + .list-row { border-top: .5px solid var(--sep); }
button.list-row:active { background: var(--fill); }
.list-row.static, .input-row { cursor: default; }
.row-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.row-ic .ic { width: 18px; height: 18px; }
.row-title { flex: 1; min-width: 0; font-size: 16px; display: flex; flex-direction: column; line-height: 1.35; }
.row-title small { font-size: 13px; color: var(--label2); line-height: 1.45; }
.row-val { color: var(--label2); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row-val.income { color: var(--income-text); font-weight: 700; }
.as-btn { text-align: left; }
.list-row .seg { flex: none; }
.input-row select, .field select { background-image: linear-gradient(45deg, transparent 50%, var(--label2) 50%), linear-gradient(135deg, var(--label2) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px !important; }
.input-row select { border: 0; background-color: var(--fill); border-radius: 10px; height: 38px; padding: 0 10px; max-width: 58%; color: var(--label); }
.input-row .row-title .meter { margin: 6px 0 2px; height: 5px; }
.yen-input { display: inline-flex; align-items: center; gap: 4px; color: var(--label2); }
.yen-input input { width: 124px; text-align: right; border: 0; background: var(--fill); border-radius: 10px; height: 40px; padding: 0 10px; outline: none; color: var(--label); font-variant-numeric: tabular-nums; }
.yen-input.big { display: flex; font-size: 20px; }
.yen-input.big input { width: 100%; font-size: 22px; font-weight: 700; height: 50px; }
.order-btns { display: flex; gap: 4px; }
.mini-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--fill); display: grid; place-items: center; color: var(--label2); }
.mini-btn[disabled] { opacity: .3; pointer-events: none; }
.mini-btn .ic { width: 18px; height: 18px; }
.check-ic { color: var(--accent); }
.check-space { width: 22px; flex: none; }
.danger-zone .list-row { color: var(--danger-text); }
.danger-zone .list-row:first-child { color: var(--accent); }
.note { font-size: 13px; color: var(--label2); line-height: 1.65; margin: 8px 4px 14px; }
.preview { display: flex; flex-direction: column; gap: 2px; }
.preview b { font-size: 18px; }
.preview.small b { font-size: 16px; }
.info-card { display: flex; gap: 12px; align-items: flex-start; }
.info-card .ic { width: 26px; height: 26px; }
.info-card p { margin: 2px 0 0; font-size: 13px; color: var(--label2); }
.help-block { background: var(--card); border-radius: 14px; padding: 4px 16px 12px; margin: 12px auto; font-size: 14.5px; line-height: 1.7; box-shadow: var(--shadow); }
.help-block h3 { font-size: 15.5px; margin: 16px 0 6px; }
.help-block p { margin: 0 0 8px; }
.help-block ol, .help-block ul { padding-left: 1.4em; margin: 0 0 8px; }
.help-block code { font-size: 12.5px; background: var(--fill); border-radius: 5px; padding: 1px 5px; word-break: break-all; }

/* ---------- サブ画面 ---------- */
.page { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.page.in { transform: none; }
.page.out { transform: translateX(100%); }
.page-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: calc(env(safe-area-inset-top) + 4px) max(6px, env(safe-area-inset-right)) 4px max(6px, env(safe-area-inset-left)); min-height: 52px; background: var(--bg); border-bottom: .5px solid var(--sep); flex: none; }
.page-head h1 { font-size: 17px; font-weight: 700; margin: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58vw; }
.back { display: inline-flex; align-items: center; gap: 0; color: var(--accent); font-size: 17px; min-height: 44px; padding: 0 6px 0 0; justify-self: start; }
.back .ic { width: 26px; height: 26px; }
.head-btn { color: var(--accent); font-size: 16px; min-height: 44px; padding: 0 8px; justify-self: end; white-space: nowrap; }
.head-btn.strong { font-weight: 700; }
.head-btn.icon-only { display: grid; place-items: center; width: 44px; }
.head-spacer { justify-self: end; width: 44px; }
.page-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(16px, env(safe-area-inset-left)); }
.page-body > * { max-width: 608px; margin-left: auto; margin-right: auto; }
.page-actions { display: flex; flex-direction: column; gap: 10px; margin: 16px auto; }

/* ---------- 入力シート ---------- */
#sheet-root .sheet-backdrop { position: fixed; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity .25s; z-index: 30; }
#sheet-root.open .sheet-backdrop { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px; z-index: 31; background: var(--sheet); border-radius: 20px 20px 0 0; transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .85, .25, 1); display: flex; flex-direction: column; max-height: calc(100% - env(safe-area-inset-top) - 6px); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -6px 28px rgba(0, 0, 0, .14); }
#sheet-root.open .sheet { transform: none; }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--fill2); margin: 6px auto 0; flex: none; }
.entry-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 2px 8px; flex: none; min-height: 48px; }
.entry-head > :first-child { justify-self: start; }
.entry-head h2 { font-size: 17px; margin: 0; text-align: center; }
.type-seg button { min-width: 76px; }
.sheet.entry.is-income .type-seg button.on { color: var(--income-text); }
.entry-amount { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 14px 0; padding: 8px 14px; background: var(--card); border-radius: 14px; min-height: 66px; flex: none; }
.entry-cat { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; }
.entry-cat .placeholder { color: var(--label3); font-weight: 500; font-size: 14px; }
.entry-yen { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--label); line-height: 1.1; }
.entry-yen small { font-size: .55em; margin-right: 2px; color: var(--label2); font-weight: 700; }
.entry-yen.zero b { color: var(--label3); }
.sheet.entry.is-income .entry-yen b { color: var(--income-text); }
.entry-err { margin: 6px 16px 0; color: var(--danger-text); font-size: 13px; font-weight: 700; flex: none; }
.entry-err:empty { display: none; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.entry-row { display: flex; gap: 8px; margin: 8px 14px 0; flex: none; }
.date-chip { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; height: 42px; border-radius: 12px; background: var(--card); font-size: 14px; font-weight: 700; white-space: nowrap; flex: none; overflow: hidden; }
.date-chip .ic { width: 18px; height: 18px; color: var(--accent); }
.date-chip em { font-style: normal; font-size: 11px; color: var(--accent); background: var(--accent-weak); padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
.date-chip input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; -webkit-appearance: none; appearance: none; border: 0; cursor: pointer; }
.memo { flex: 1; min-width: 0; height: 42px; border-radius: 12px; border: 0; background: var(--card); padding: 0 12px; outline: none; color: var(--label); }
.method-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 2px; flex: none; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.method-chips::-webkit-scrollbar { display: none; }
.m-chip { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; border-radius: 999px; background: var(--card); font-size: 13.5px; font-weight: 600; white-space: nowrap; flex: none; border: 1.5px solid transparent; }
.m-chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }
.cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px 10px 4px; overflow-y: auto; flex: 1 1 auto; min-height: 112px; align-content: start; -webkit-overflow-scrolling: touch; }
.cat-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 1px; border-radius: 12px; border: 1.5px solid transparent; min-width: 0; }
.cat-cell .cat-ic { width: 38px; height: 38px; font-size: 20px; }
.cat-cell .cat-name { font-size: 11px; font-weight: 600; line-height: 1.2; text-align: center; word-break: keep-all; overflow-wrap: anywhere; max-height: 2.4em; overflow: hidden; }
.cat-cell.on { background: var(--card); border-color: var(--c); }
.cat-cell:active { background: var(--fill); }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 52px); gap: 6px; padding: 8px 10px 10px; flex: none; }
.key { background: var(--key-bg); border-radius: 12px; font-size: 25px; font-weight: 500; font-variant-numeric: tabular-nums; box-shadow: 0 1px 0 var(--key-shadow); text-align: center; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.key:active { background: var(--fill2); }
.key.fn { background: var(--key-fn); display: grid; place-items: center; }
.key.fn .ic { width: 28px; height: 28px; }
.key.save { grid-column: 4; grid-row: 2 / span 3; background: var(--accent); color: var(--on-accent); font-size: 19px; font-weight: 800; }
.key.save:active { filter: brightness(.9); }
.key.save:disabled { opacity: .6; }
@media (max-height: 720px) {
  .keypad { grid-template-rows: repeat(4, 44px); gap: 5px; padding-top: 6px; }
  .entry-yen { font-size: 34px; }
  .entry-amount { min-height: 56px; padding: 4px 12px; }
  .cat-cell { padding: 4px 1px; }
  .cat-cell .cat-ic { width: 32px; height: 32px; font-size: 17px; }
  .cat-grid { min-height: 96px; }
}

/* ---------- ダイアログ ---------- */
.dlg-wrap { position: fixed; inset: 0; z-index: 40; display: flex; }
.dlg-backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity .2s; }
.dlg-wrap.in .dlg-backdrop { opacity: 1; }
.dlg-wrap.center { align-items: center; justify-content: center; padding: 24px; }
.alert { position: relative; width: min(310px, 100%); background: var(--elev); border-radius: 18px; overflow: hidden; transform: scale(1.08); opacity: 0; transition: transform .2s, opacity .2s; max-height: 86vh; display: flex; flex-direction: column; }
.dlg-wrap.in .alert { transform: none; opacity: 1; }
.alert-body { padding: 20px 16px 14px; text-align: center; overflow-y: auto; }
.alert-body h2 { font-size: 17px; margin: 0 0 6px; font-weight: 700; }
.alert-body p { font-size: 14px; margin: 0; line-height: 1.6; }
.alert-body .field { text-align: left; }
.alert-btns { display: flex; border-top: .5px solid var(--sep); flex: none; }
.alert-btns button { flex: 1; min-height: 48px; font-size: 17px; color: var(--accent); text-align: center; padding: 0 8px; }
.alert-btns button + button { border-left: .5px solid var(--sep); }
.alert-btns.stack { flex-direction: column; }
.alert-btns.stack button + button { border-left: 0; border-top: .5px solid var(--sep); }
.alert-btns .destructive { color: var(--danger-text); }
.alert-btns .cancel { font-weight: 700; }
.alert-btns button:active { background: var(--fill); }
.confirm-input { margin-top: 12px; height: 44px; border-radius: 10px; border: 0; background: var(--fill); padding: 0 12px; width: 100%; outline: none; text-align: center; color: var(--label); }

      { id: idGen(), type: 'expense', amount: 6200, categoryId: 'e_insurance', methodId: 'm_credit', memo: '保険料（サンプル）', day: 5, startMonth: startMonth, endMonth: null, active: true, lastMonth: null, createdAt: now, sample: true }
    ];

  }

 * ・書き込みは1つのトランザクションでまとめて行い、途中で失敗したら何も保存しません（データ破損の防止）。
 * ・iOSでアプリを長時間バックグラウンドにした後などに接続が切れた場合は、自動で開き直して1回だけ再試行します。
 *   書き込みはすべてID指定の上書き（put）なので、再試行しても二重登録になりません。
 * ・IndexedDBが使えない環境（一部のプレビュー表示など）では、メモリ上で動作します（再起動すると消えます）。
 */
(function (root) {
  'use strict';
  var DB_NAME = 'kakeibo-db';
  var DB_VERSION = 1;
  var KEYPATH = { transactions: 'id', categories: 'id', methods: 'id', recurring: 'id', kv: 'key', trash: 'id' };
  var STORES = Object.keys(KEYPATH);

  var db = null, opening = null, mode = null, mem = null;
  var onVersionChange = null;

  function upgrade(d, oldVersion) {
    if (oldVersion < 1) {
      var t = d.createObjectStore('transactions', { keyPath: 'id' });
      t.createIndex('date', 'date');
      t.createIndex('recurringKey', 'recurringKey', { unique: true });
      d.createObjectStore('categories', { keyPath: 'id' });
      d.createObjectStore('methods', { keyPath: 'id' });
      d.createObjectStore('recurring', { keyPath: 'id' });
      d.createObjectStore('kv', { keyPath: 'key' });
      var tr = d.createObjectStore('trash', { keyPath: 'id' });
      tr.createIndex('deletedAt', 'deletedAt');
    }
  }

  function openOnce(timeoutMs) {
    return new Promise(function (resolve, reject) {
      var done = false, req;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        var e = new Error('データベースの準備が時間内に終わりませんでした'); e.name = 'TimeoutError';
        reject(e);
      }, timeoutMs);
      try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { done = true; clearTimeout(timer); reject(e); return; }
      req.onupgradeneeded = function (ev) { upgrade(req.result, ev.oldVersion); };
      req.onsuccess = function () {
        var d = req.result;
        if (done) { try { d.close(); } catch (x) { /* noop */ } return; }
        done = true; clearTimeout(timer);
        d.onversionchange = function () {
          try { d.close(); } catch (x) { /* noop */ }
          db = null;
          if (onVersionChange) onVersionChange();
        };
        d.onclose = function () { db = null; };
        resolve(d);
      };
      req.onerror = function () {
        if (done) return;
        done = true; clearTimeout(timer);
        reject(req.error || new Error('データベースを開けませんでした'));
      };
    });
  }

  function getDB() {
    if (db) return Promise.resolve(db);
    if (!opening) {
      opening = openOnce(8000).then(function (d) { db = d; opening = null; return d; },
        function (e) { opening = null; throw e; });
    }
    return opening;
  }

  function isRetryable(e) {
    if (!e) return false;
    var n = e.name || '';
    if (n === 'InvalidStateError' || n === 'UnknownError' || n === 'TransactionInactiveError' || n === 'TimeoutError') return true;
    return /connection|closing|closed|lost/i.test(e.message || '');
  }

  function withRetry(fn) {
    return fn().catch(function (e) {
      if (!isRetryable(e)) throw e;
      try { if (db) db.close(); } catch (x) { /* noop */ }
      db = null;
      return new Promise(function (r) { setTimeout(r, 120); }).then(fn);
    });
  }

  /* ---------- メモリ保存（代替） ---------- */
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function makeMem() { var m = {}; STORES.forEach(function (s) { m[s] = {}; }); return m; }
  function memGetAll(store) { var o = mem[store]; return Object.keys(o).map(function (k) { return clone(o[k]); }); }
  function memWrite(ops) {
    var work = {}, results = [];
    STORES.forEach(function (s) { work[s] = Object.assign({}, mem[s]); });
    function recKeyTaken(key, exceptId) {
      var o = work.transactions;
      return Object.keys(o).some(function (id) { return id !== exceptId && o[id].recurringKey === key; });
    }
    ops.forEach(function (op, i) {
      var store = work[op.store], kp = KEYPATH[op.store];
      if (op.type === 'put') {
        var v = clone(op.value);
        if (op.store === 'transactions' && v.recurringKey && recKeyTaken(v.recurringKey, v[kp])) {
          var e = new Error('重複した定期登録です'); e.name = 'ConstraintError'; throw e;
        }
        store[v[kp]] = v;
      } else if (op.type === 'delete') {
        delete store[op.key];
      } else if (op.type === 'clear') {
        work[op.store] = {};
      } else if (op.type === 'putIfAbsent') {
        if (recKeyTaken(op.indexKey, null)) { results[i] = false; return; }
        var w = clone(op.value); work[op.store][w[kp]] = w; results[i] = true;
      }
    });
    STORES.forEach(function (s) { mem[s] = work[s]; });
    return results;
  }

  /* ---------- 公開API ---------- */
  function init() {
    if (typeof indexedDB === 'undefined' || !indexedDB) {
      mode = 'memory'; mem = makeMem();
      return Promise.resolve({ mode: mode, reason: 'unsupported' });
    }

      .then(function (d) { db = d; mode = 'idb'; return { mode: mode }; })
      .catch(function (e) { mode = 'memory'; mem = makeMem(); return { mode: mode, reason: (e && (e.name || e.message)) || 'error' }; });
  }

  function readStores(names) {
    if (mode === 'memory') {
      var out = {}; names.forEach(function (n) { out[n] = memGetAll(n); }); return Promise.resolve(out);
    }
    return withRetry(function () {
      return getDB().then(function (d) {
        return new Promise(function (resolve, reject) {
          var tx = d.transaction(names, 'readonly');
          var out = {};
          names.forEach(function (n) {
            var req = tx.objectStore(n).getAll();
            req.onsuccess = function () { out[n] = req.result || []; };
          });
          tx.oncomplete = function () { resolve(out); };
          tx.onabort = function () { reject(tx.error || new Error('読み込みに失敗しました')); };
          tx.onerror = function () { /* onabort で処理 */ };
        });
      });
    });
  }

  function write(ops) {
    if (!ops.length) return Promise.resolve([]);
    if (mode === 'memory') {
      try { return Promise.resolve(memWrite(ops)); } catch (e) { return Promise.reject(e); }
    }
    var names = [];
    ops.forEach(function (o) { if (names.indexOf(o.store) < 0) names.push(o.store); });
    return withRetry(function () {
      return getDB().then(function (d) {
        return new Promise(function (resolve, reject) {
          var tx;
          try { tx = d.transaction(names, 'readwrite', { durability: 'strict' }); } catch (e1) {
            try { tx = d.transaction(names, 'readwrite'); } catch (e2) { reject(e2); return; }
          }
          var results = [];
          tx.oncomplete = function () { resolve(results); };
          tx.onabort = function () { reject(tx.error || new Error('保存が中断されました')); };
          tx.onerror = function () { /* onabort で処理 */ };
          try {
            ops.forEach(function (op, i) {
              var os = tx.objectStore(op.store);
              if (op.type === 'put') os.put(op.value);
              else if (op.type === 'delete') os.delete(op.key);
              else if (op.type === 'clear') os.clear();
              else if (op.type === 'putIfAbsent') {
                var r = os.index(op.index).getKey(op.indexKey);
                r.onsuccess = function () {
                  if (r.result === undefined) { os.put(op.value); results[i] = true; } else results[i] = false;
                };
              }
            });
          } catch (e) {
            try { tx.abort(); } catch (x) { /* noop */ }
            reject(e);
          }
        });
      });
    });
  }

  function deleteDatabase() {
    if (mode === 'memory') { mem = makeMem(); return Promise.resolve(); }
    return new Promise(function (resolve, reject) {
      try { if (db) db.close(); } catch (x) { /* noop */ }
      db = null;
      var req = indexedDB.deleteDatabase(DB_NAME);
      req.onsuccess = function () { resolve(); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { resolve(); };
    });
  }

  root.KDB = {
    init: init,
    readStores: readStores,
    write: write,
    deleteDatabase: deleteDatabase,
    getMode: function () { return mode; },
    setVersionChangeHandler: function (fn) { onVersionChange = fn; },
    STORES: STORES
  };
}(typeof self !== 'undefined' ? self : this));

  function errorText(e) {
    var n = e && e.name;
    if (n === 'QuotaExceededError') return 'iPhoneの空き容量が足りないため保存できませんでした。不要なファイルを削除してから、もう一度お試しください。';
    if (n === 'ConstraintError') return '同じデータがすでに登録されているため保存しませんでした。';
    return '保存できませんでした。アプリを開き直してから、もう一度お試しください。（' + esc((e && (e.name || e.message)) || '不明なエラー') + '）';
  }
  function commit(ops) {
    return DB.write(ops).catch(function (e) {
      alertDialog({ title: '保存できませんでした', message: errorText(e) });
      throw e;
    });
  }

  var bc = null;
  function setupChannel() {
    try {
      bc = new BroadcastChannel('kakeibo-sync');
      bc.onmessage = function () { loadAll().then(function () { afterChange(true); }); };
    } catch (e) { bc = null; }
  }
  function afterChange(fromOtherTab) {
    reindex();
    Object.keys(S.ui.dirty).forEach(function (k) { S.ui.dirty[k] = true; });
    renderActive();
    refreshPages();
    if (!fromOtherTab && bc) { try { bc.postMessage('changed'); } catch (e) { /* noop */ } }
    if (!fromOtherTab) maybePersist();
  }

  /* --- 明細 --- */
  function saveTx(tx, extraOps) {
    var ops = [{ type: 'put', store: 'transactions', value: tx }].concat(extraOps || []);
    return commit(ops).then(function () {
      var i = findIndex(S.tx, function (t) { return t.id === tx.id; });
      if (i >= 0) S.tx[i] = tx; else S.tx.push(tx);
      afterChange();
    });
  }
  function hardDeleteTx(id) {
    return commit([{ type: 'delete', store: 'transactions', key: id }]).then(function () {
      var i = findIndex(S.tx, function (t) { return t.id === id; });
      if (i >= 0) S.tx.splice(i, 1);
      afterChange();
    });
  }
  function deleteTx(id) {
    var t = find(S.tx, function (x) { return x.id === id; });
    if (!t) return Promise.resolve(null);
    var tr = Object.assign({}, t, { deletedAt: nowISO() });
    return commit([{ type: 'delete', store: 'transactions', key: id }, { type: 'put', store: 'trash', value: tr }]).then(function () {
      var i = findIndex(S.tx, function (x) { return x.id === id; });
      if (i >= 0) S.tx.splice(i, 1);
      S.trash.push(tr);
      afterChange();
      return tr;
    });
  }
  function restoreTrash(id) {
    var tr = find(S.trash, function (x) { return x.id === id; });
    if (!tr) return Promise.resolve(null);
    var t = Object.assign({}, tr);
    delete t.deletedAt;
    if (!S.catMap[t.categoryId] || S.catMap[t.categoryId].type !== t.type) t.categoryId = fallbackCategoryId(t.type);
    if (t.methodId && !S.methodMap[t.methodId]) t.methodId = '';
    if (t.recurringKey && S.tx.some(function (x) { return x.recurringKey === t.recurringKey && x.id !== t.id; })) delete t.recurringKey;
    return commit([{ type: 'put', store: 'transactions', value: t }, { type: 'delete', store: 'trash', key: id }]).then(function () {
      S.trash = S.trash.filter(function (x) { return x.id !== id; });
      var i = findIndex(S.tx, function (x) { return x.id === t.id; });
      if (i >= 0) S.tx[i] = t; else S.tx.push(t);
      afterChange();
      return t;
    });
  }
  function purgeTrash(ids) {
    if (!ids.length) return Promise.resolve();
    return commit(ids.map(function (id) { return { type: 'delete', store: 'trash', key: id }; })).then(function () {
      S.trash = S.trash.filter(function (x) { return ids.indexOf(x.id) < 0; });
      afterChange();
    });
  }
  function autoPurgeTrash() {
    var limit = Date.now() - K.TRASH_DAYS * 86400000;
    var old = S.trash.filter(function (x) { var t = Date.parse(x.deletedAt); return !isNaN(t) && t < limit; }).map(function (x) { return x.id; });
    if (!old.length) return Promise.resolve();
    return DB.write(old.map(function (id) { return { type: 'delete', store: 'trash', key: id }; })).then(function () {
      S.trash = S.trash.filter(function (x) { return old.indexOf(x.id) < 0; });
    }).catch(noop);
  }

  /* --- 定期収支の自動登録（重複しない仕組み） ---
   * 1) ルールごとに「登録済みの最後の月」を記録し、それより後の月だけを対象にします。
   * 2) 明細には「ルールID:月」の一意キーを付け、データベースの一意制約で二重登録を防ぎます。
   * 3) 明細の追加と「最後の月」の更新は1つのトランザクションで行います。 */
  var recurringRunning = false;
  function runRecurring() {
    if (recurringRunning) return Promise.resolve(0);
    var today = S.today, ops = [], now = nowISO();
    S.rules.forEach(function (r) {
      var p = K.pendingRecurring(r, today);
      if (!p.items.length) return;
      p.items.forEach(function (it) {
        var tx = {
          id: K.uuid(), type: r.type, date: it.date, amount: r.amount,
          categoryId: (S.catMap[r.categoryId] && S.catMap[r.categoryId].type === r.type) ? r.categoryId : fallbackCategoryId(r.type),
          methodId: (r.methodId && S.methodMap[r.methodId]) ? r.methodId : '',
          memo: r.memo || '', createdAt: now, updatedAt: now, recurringKey: it.key, ruleId: r.id
        };
        if (r.sample) tx.sample = true;
        ops.push({ type: 'putIfAbsent', store: 'transactions', index: 'recurringKey', indexKey: it.key, value: tx });
      });
      var nr = Object.assign({}, r, { lastMonth: p.lastMonth });
      ops.push({ type: 'put', store: 'recurring', value: nr });
    });
    if (!ops.length) return Promise.resolve(0);
    recurringRunning = true;
    return DB.write(ops).then(function (results) {
      var n = results.filter(function (x) { return x === true; }).length;
      return loadAll().then(function () { recurringRunning = false; afterChange(); return n; });
    }, function (e) { recurringRunning = false; console.warn('recurring', e); return 0; });
  }

  /* --- 設定・予算 --- */
  function saveSettings(patch) {
    var next = K.normalizeSettings(Object.assign({}, S.settings, patch));
    return commit([kvOp('settings', next)]).then(function () { S.settings = next; applyTheme(); applyFabSide(); afterChange(); });
  }
  function saveBudgets(b, extra) {
    var next = K.normalizeBudgets(b);
    var meta = Object.assign({}, S.meta, { sampleBudget: false });
    return commit([kvOp('budgets', next), kvOp('meta', meta)].concat(extra || [])).then(function () { S.budgets = next; S.meta = meta; afterChange(); });
  }
  function saveMeta(patch) {
    var meta = Object.assign({}, S.meta, patch);
    return DB.write([kvOp('meta', meta)]).then(function () { S.meta = meta; }).catch(noop);
  }

  /* --- サンプルデータ --- */
  function hasSample() { return S.tx.some(function (t) { return t.sample; }) || S.rules.some(function (r) { return r.sample; }); }
  function addSampleData() {
    var s = K.makeSampleData(S.today, K.uuid);
    var ops = s.transactions.map(function (t) { return { type: 'put', store: 'transactions', value: t }; });
    s.recurring.forEach(function (r) { ops.push({ type: 'put', store: 'recurring', value: r }); });
    var b = S.budgets, noBudget = b.default.total === null && !Object.keys(b.default.cats).length;
    if (noBudget) {
      ops.push(kvOp('budgets', { default: s.budget, months: b.months }));
      ops.push(kvOp('meta', Object.assign({}, S.meta, { sampleBudget: true })));
    }
    return commit(ops).then(loadAll).then(function () { return runRecurring(); }).then(function () { afterChange(); });
  }
  function clearSampleData() {
    var ops = [];
    S.tx.forEach(function (t) { if (t.sample) ops.push({ type: 'delete', store: 'transactions', key: t.id }); });
    S.rules.forEach(function (r) { if (r.sample) ops.push({ type: 'delete', store: 'recurring', key: r.id }); });
    S.trash.forEach(function (t) { if (t.sample) ops.push({ type: 'delete', store: 'trash', key: t.id }); });
    if (S.meta.sampleBudget) {
      ops.push(kvOp('budgets', { default: K.emptyBudget(), months: S.budgets.months }));
      ops.push(kvOp('meta', Object.assign({}, S.meta, { sampleBudget: false })));
    }
    if (!ops.length) return Promise.resolve();
    return commit(ops).then(loadAll).then(function () { afterChange(); });
  }

  /* ================= 永続化（ストレージの保護） ================= */
  var persistAsked = false;
  function maybePersist() {
    if (persistAsked || S.storage.mode !== 'idb') return;
    persistAsked = true;
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then(function (p) {
          if (p) { S.env.persisted = true; return; }
          return navigator.storage.persist().then(function (g) { S.env.persisted = !!g; });
        }).catch(noop);
      }
    } catch (e) { /* noop */ }
  }
  function refreshStorageInfo() {
    try {
      if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(function (p) { S.env.persisted = p; refreshPages(); }).catch(noop);
      if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(function (e) { S.env.estimate = e; refreshPages(); }).catch(noop);
    } catch (e) { /* noop */ }
  }

  /* ================= テーマ ================= */
  function applyTheme() {
    var t = S.settings.theme, root = document.documentElement;
    if (t === 'light' || t === 'dark') root.setAttribute('data-app-theme', t); else root.removeAttribute('data-app-theme');
    var dark = t === 'dark' || (t === 'system' && (root.getAttribute('data-theme') === 'dark' ||
      (root.getAttribute('data-theme') !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)));
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#000000' : '#F2F2F7');
  }
  function applyFabSide() { document.body.classList.toggle('fab-left', S.settings.fabSide === 'left'); }

  /* ================= 画面の土台 ================= */
  var TABS = [
    { id: 'home', label: 'ホーム', icon: 'home' },
    { id: 'history', label: '履歴', icon: 'list' },
    { id: 'calendar', label: 'カレンダー', icon: 'calendar' },
    { id: 'analysis', label: '分析', icon: 'chart' },
    { id: 'settings', label: '設定', icon: 'gear' }
  ];
  function buildShell() {
    var app = $('#app');
    var html = '';
    TABS.forEach(function (t) {
      html += '<section class="tabview" id="tab-' + t.id + '" data-tab="' + t.id + '"' + (t.id === S.ui.tab ? '' : ' hidden') + '></section>';
    });
    html += '<button class="fab" id="fab" type="button" data-action="add" aria-label="収支を登録">' + icon('plus') + '</button>';
    html += '<nav class="tabbar" role="tablist">';
    TABS.forEach(function (t) {
      html += '<button type="button" role="tab" class="tab' + (t.id === S.ui.tab ? ' on' : '') + '" data-action="tab" data-tab="' + t.id + '" aria-selected="' + (t.id === S.ui.tab) + '">' + icon(t.icon) + '<span>' + t.label + '</span></button>';
    });
    html += '</nav>';
    html += '<div id="page-root"></div><div id="sheet-root"></div><div id="dialog-root"></div><div id="toast-root" aria-live="polite"></div>';
    app.innerHTML = html;
  }
  function switchTab(id) {
    if (S.ui.tab === id) {
      var view = $('#tab-' + id);
      if (view) view.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    S.ui.tab = id;
    $$('.tabview').forEach(function (v) { v.hidden = v.getAttribute('data-tab') !== id; });
    $$('.tabbar .tab').forEach(function (b) {
      var on = b.getAttribute('data-tab') === id;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    renderActive();
  }
  var RENDER = {};
  function renderActive(force) {
    var id = S.ui.tab;
    if (!force && !S.ui.dirty[id]) return;
    S.ui.dirty[id] = false;
    var el = $('#tab-' + id);
    if (!el || !RENDER[id]) return;
    el.innerHTML = RENDER[id]();
  }
  function pageHead(title, sub) {
    return '<header class="head"><h1>' + esc(title) + '</h1>' + (sub ? '<p class="head-sub">' + sub + '</p>' : '') + '</header>';
  }
  function bannerHTML(kind, iconName, text, actions) {
    return '<div class="banner ' + kind + '">' + icon(iconName) + '<div class="banner-body"><p>' + text + '</p>' +
      (actions ? '<div class="banner-actions">' + actions + '</div>' : '') + '</div></div>';
  }
  function banners() {
    var out = '';
    var e = S.env;
    if (S.storage.mode === 'memory' && !e.iframe) {
      out += bannerHTML('danger', 'warn', 'この表示環境では端末に保存できないため、入力したデータはアプリを閉じると消えます。iPhoneのSafariでホーム画面に追加して使ってください。');
    }
    if (e.iframe) {
      out += bannerHTML('info', 'info', 'Claude上のお試し表示です。ここで入力したデータは残らない場合があります。毎日の利用は、導入ガイドの手順でiPhoneのホーム画面に追加してください。',
        '<button class="btn-text" data-action="open-page" data-page="help">使い方を見る</button>');
    } else if (e.ios && !e.standalone && !S.settings.installBannerDismissed) {
      out += bannerHTML('info', 'info', 'Safariで表示しています。共有メニューの「ホーム画面に追加」でアプリとして使えます。※Safariとホーム画面のアプリでは、保存されるデータが別々です。',
        '<button class="btn-text" data-action="open-page" data-page="help">手順を見る</button><button class="btn-text muted" data-action="dismiss-install">閉じる</button>');
    }
    if (hasSample()) {
      out += bannerHTML('info', 'sparkle', 'サンプルデータを表示しています。自分の記録を始めるときは消してください。',
        '<button class="btn-text" data-action="clear-sample">サンプルを消す</button>');
    }
    var days = S.settings.backupReminderDays;
    if (days && S.tx.length && S.storage.mode === 'idb' && !e.iframe) {
      var last = S.meta.lastBackupAt ? Date.parse(S.meta.lastBackupAt) : null;
      var since = last ? Math.floor((Date.now() - last) / 86400000) : null;
      var created = S.meta.createdAt ? Date.parse(S.meta.createdAt) : Date.now();
      var age = Math.floor((Date.now() - created) / 86400000);
      if ((since === null && age >= 7) || (since !== null && since >= days)) {
        out += bannerHTML('warn', 'save', (since === null ? 'まだバックアップがありません。' : '最後のバックアップから' + since + '日たちました。') +
          'iPhoneの故障や機種変更に備えて、バックアップを保存しましょう。',
          '<button class="btn-text" data-action="open-page" data-page="data">バックアップする</button>');
      }
    }
    return out;
  }

  /* ================= ホーム ================= */
  RENDER.home = function () {
    var pk = curPeriodKey(), r = K.periodRange(pk, sd());
    var sum = K.summarize(S.tx, r.start, r.end);
    var html = '<header class="head"><p class="head-date">' + esc(K.formatDateJa(S.today, true)) + '</p><h1>' + esc(periodLabel(pk, false)) + 'の家計</h1>' +
      (sd() !== 1 ? '<p class="head-sub">' + esc(periodRangeText(pk)) + '</p>' : '') + '</header>';
    html += banners();
    if (!S.tx.length) {
      html += '<div class="card welcome"><h2>はじめましょう</h2><p>右下の<b>＋</b>ボタンから、今日の支出を登録できます。金額を押して、カテゴリーを選んで「保存」。数秒で終わります。</p>' +
        '<div class="row-gap"><button class="btn primary" data-action="add">' + icon('plus') + '最初の支出を登録</button>' +
        '<button class="btn" data-action="add-sample">サンプルデータで試す</button></div></div>';
    }
    // 収支
    var balCls = sum.balance >= 0 ? 'pos' : 'neg';
    html += '<section class="card summary" aria-label="今月の収支">' +
      '<div class="sum-main"><span class="k">' + legendDot('expense') + '支出</span><span class="v hero">' + yen(sum.expense) + '</span></div>' +
      '<div class="sum-sub">' +
      '<div><span class="k">' + legendDot('income') + '収入</span><span class="v income">' + yen(sum.income) + '</span></div>' +
      '<div><span class="k"><span class="sign-dot ' + balCls + '">' + (sum.balance >= 0 ? '+' : '−') + '</span>収支</span><span class="v ' + balCls + '">' + yen(sum.balance, true) + '</span></div>' +
      '</div></section>';
    html += homeBudgetCard(pk, r, sum);
    html += homeCompareCard(pk, r);
    html += homeCategoryCard(r);
    html += homeRecentCard();
    return html;
  };
  function legendDot(kind) { return '<span class="ldot ' + kind + '"></span>'; }

  function levelChip(level, rate) {
    if (level === 'over') return '<span class="chip danger">' + icon('warn') + '予算超過</span>';
    if (level === 'warn') return '<span class="chip warn">' + icon('warn') + Math.floor(rate) + '%</span>';
    return '';
  }
  function meter(rate, level) {
    var w = Math.max(0, Math.min(100, rate));
    return '<div class="meter ' + level + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(rate) + '"><span style="width:' + f1(w) + '%"></span></div>';
  }
  function catBudgetStatuses(pk, r) {
    var eb = K.effectiveBudget(S.budgets, pk).entry;
    var spentBy = {};
    K.sumByCategory(S.tx, r.start, r.end, 'expense').forEach(function (e) { spentBy[e.id] = e.amount; });
    var list = [];
    Object.keys(eb.cats).forEach(function (cid) {
      var st = K.budgetStatus(spentBy[cid] || 0, eb.cats[cid]);
      if (st) { st.cat = catOf(cid); list.push(st); }
    });
    list.sort(function (a, b) { return b.rate - a.rate; });
    return list;
  }
  function homeBudgetCard(pk, r, sum) {
    var eb = K.effectiveBudget(S.budgets, pk).entry;
    var st = K.budgetStatus(sum.expense, eb.total);
    var cats = catBudgetStatuses(pk, r);
    var alerts = cats.filter(function (c) { return c.level !== 'ok'; });
    var html = '<section class="card tap" data-action="open-page" data-page="budget" aria-label="今月の予算"><div class="card-head"><h2>今月の予算</h2>' + icon('next', 'chev') + '</div>';
    if (!st && !cats.length) {
      html += '<p class="muted">予算が未設定です。月の予算を決めると、残りの金額と使ったペースが分かります。</p><span class="btn-text">予算を設定する</span></section>';
      return html;
    }
    if (st) {
      var daysLeft = Math.max(1, K.diffDays(S.today, r.end) + 1);
      var inPeriod = S.today >= r.start && S.today <= r.end;
      html += '<div class="budget-top"><div><span class="k">残り</span><span class="v big ' + (st.remaining < 0 ? 'neg' : '') + '">' + yen(st.remaining) + '</span></div>' + levelChip(st.level, st.rate) + '</div>';
      html += meter(st.rate, st.level);
      html += '<div class="budget-foot"><span>' + yen(st.spent) + ' / ' + yen(st.budget) + '</span><span>消化率 ' + Math.floor(st.rate) + '%</span></div>';
      if (inPeriod && st.remaining > 0) html += '<p class="hint">残り' + daysLeft + '日。1日あたり <b>' + yen(Math.floor(st.remaining / daysLeft)) + '</b> まで使えます。</p>';
      if (st.level === 'over') html += '<p class="alert-line danger">' + icon('warn') + '予算を ' + yen(-st.remaining) + ' 超えています。</p>';
      else if (st.level === 'warn') html += '<p class="alert-line warn">' + icon('warn') + '予算の80%に達しました。</p>';
    } else {
      html += '<p class="muted small">月全体の予算は未設定です。</p>';
    }
    if (alerts.length) {
      html += '<ul class="mini-list">';
      alerts.slice(0, 4).forEach(function (c) {
        html += '<li><span class="cat-ic sm" style="--c:' + c.cat.color + '">' + esc(c.cat.icon) + '</span><span class="name">' + esc(c.cat.name) + '</span>' +
          '<span class="val">' + yen(c.spent) + ' / ' + yen(c.budget) + '</span>' + levelChip(c.level, c.rate) + '</li>';
      });
      html += '</ul>';
    } else if (cats.length) {
      html += '<p class="hint">' + icon('check', 'ok-ic') + 'カテゴリー別の予算はすべて80%未満です。</p>';
    }
    html += '</section>';
    return html;
  }
  function homeCompareCard(pk, r) {
    var pr = K.periodRange(K.addMonths(pk, -1), sd());
    var upTo = S.today < r.end ? S.today : r.end;
    var curSoFar = K.summarize(S.tx, r.start, upTo).expense;
    var elapsed = K.diffDays(r.start, upTo);
    var prevEnd = K.addDays(pr.start, elapsed);
    if (prevEnd > pr.end) prevEnd = pr.end;
    var prevSame = K.summarize(S.tx, pr.start, prevEnd).expense;
    var prevTotal = K.summarize(S.tx, pr.start, pr.end).expense;
    var diff = curSoFar - prevSame, pct = K.pctChange(curSoFar, prevSame);
    var html = '<section class="card" aria-label="前月との支出比較"><div class="card-head"><h2>前月との比較</h2></div>';
    if (!prevTotal && !curSoFar) { html += '<p class="muted">比較できるデータがまだありません。</p></section>'; return html; }
    var more = diff > 0;
    html += '<p class="compare-main">前月の同じ時点（' + esc(K.formatDateShort(prevEnd)) + 'まで）より<br><b class="' + (diff === 0 ? '' : more ? 'neg' : 'pos') + '">' +
      (diff === 0 ? '同じ金額' : yen(Math.abs(diff)) + (more ? ' 多い' : ' 少ない')) + '</b>' +
      (pct !== null && diff !== 0 ? '<span class="pct">（' + K.formatPct(pct) + '）</span>' : '') + '</p>';
    var max = Math.max(curSoFar, prevSame, 1);
    html += '<div class="cmp-bars">' +

    html += '<section class="card"><div class="stat3 small"><div><span class="k">日数</span><span class="v">' + days + '日</span></div>' +
      '<div><span class="k">1日あたり支出</span><span class="v">' + yen(Math.round(sum.expense / days)) + '</span></div>' +
      '<div><span class="k">件数</span><span class="v">' + sum.count + '件</span></div></div></section>';
    html += categorySection(from, to, null, null);
    html += methodSection(from, to);
    if (days <= 62) html += dailySection(from, to);
    else {
      var keys = [], k = from.slice(0, 7), endK = to.slice(0, 7), guard = 0;
      while (k <= endK && guard++ < 120) { keys.push(k); k = K.addMonths(k, 1); }
      var series = keys.map(function (mk) {
        var p = K.parseMonthKey(mk), ms = mk + '-01', me = K.ymd(p.y, p.m, K.daysInMonth(p.y, p.m));
        var s = K.summarize(S.tx, ms < from ? from : ms, me > to ? to : me);
        s.label = p.m + '月'; s.long = p.y + '年' + p.m + '月'; s.key = mk; return s;
      });
      html += trendSection('月ごとの推移（暦月）', series.slice(-24), 'pick');
    }
    return html;
  }

  /* ---- カテゴリー別（円グラフ＋ランキング） ---- */
  function categorySection(start, end, pstart, pend, cmpLabel) {
    var a = S.ui.ana, type = a.catType;
    var list = K.sumByCategory(S.tx, start, end, type);
    var total = list.reduce(function (s, e) { return s + e.amount; }, 0);
    var prevMap = {};
    if (pstart) K.sumByCategory(S.tx, pstart, pend, type).forEach(function (e) { prevMap[e.id] = e.amount; });
    var html = '<section class="card"><div class="card-head"><h2>カテゴリー別の' + (type === 'income' ? '収入' : '支出') + '</h2>' + seg('ana-cattype', [['expense', '支出'], ['income', '収入']], type, 'small') + '</div>';
    if (!total) return html + '<p class="muted">この期間の' + (type === 'income' ? '収入' : '支出') + 'はありません。</p></section>';
    var items = K.topN(list, 5);
    var pcts = K.sharePercents(items.map(function (e) { return e.amount; }), 0);
    var segs = items.map(function (e) { var c = e.rest ? { color: 'var(--rest)', name: 'その他' } : catOf(e.id); return { amount: e.amount, color: c.color, name: c.name }; });
    html += '<div class="donut-wrap">' + donutSVG(segs, total, type === 'income' ? '収入合計' : '支出合計') + '<ul class="legend-list compact">';
    items.forEach(function (e, i) {
      var c = e.rest ? { color: 'var(--rest)', name: 'その他' + (list.length - 5) + '件' } : catOf(e.id);
      html += '<li><span class="sw" style="background:' + c.color + '"></span><span class="name">' + esc(c.name) + '</span><span class="pct">' + pcts[i] + '%</span></li>';
    });
    html += '</ul></div>';
    // ランキング
    var allPcts = K.sharePercents(list.map(function (e) { return e.amount; }), 1);
    var max = list[0].amount;
    html += '<h3 class="sub-h">ランキング</h3><ol class="rank">';
    list.forEach(function (e, i) {
      var c = catOf(e.id);
      var pv = prevMap[e.id] || 0;
      var d = e.amount - pv, pc = K.pctChange(e.amount, pv);
      var dcls = d === 0 ? '' : (type === 'income' ? (d > 0 ? 'good' : 'bad') : (d > 0 ? 'bad' : 'good'));
      html += '<li><div class="rank-head"><span class="rank-no">' + (i + 1) + '</span><span class="cat-ic sm" style="--c:' + c.color + '">' + esc(c.icon) + '</span><span class="name">' + esc(c.name) + '</span>' +
        '<span class="val">' + yen(e.amount) + '</span><span class="pct">' + allPcts[i].toFixed(1) + '%</span></div>' +
        '<div class="hbar"><span style="width:' + f1(e.amount / max * 100) + '%;background:' + c.color + '"></span></div>' +
        (pstart ? '<div class="rank-cmp">' + esc(cmpLabel) + ' <span class="delta ' + dcls + '">' + (d > 0 ? '▲' : d < 0 ? '▼' : '±') + yen(Math.abs(d)) + (pc !== null ? '（' + K.formatPct(pc) + '）' : pv === 0 && e.amount ? '（新規）' : '') + '</span></div>' : '') + '</li>';
    });
    html += '</ol></section>';
    return html;
  }
  function donutSVG(segs, total, label) {
    var size = 172, cx = size / 2, r = 64, sw = 24, C = 2 * Math.PI * r;
    var svg = '<svg class="donut" viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" role="img" aria-label="' + esc(label) + ' ' + yen(total) + '">';
    var offset = 0, gap = segs.length > 1 ? 2 : 0;
    segs.forEach(function (s) {
      var len = s.amount / total * C;
      var dash = Math.max(0.01, len - gap);
      svg += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="' + sw + '" stroke-dasharray="' + f1(dash) + ' ' + f1(C - dash) + '" stroke-dashoffset="' + f1(-offset) + '" transform="rotate(-90 ' + cx + ' ' + cx + ')"><title>' + esc(s.name) + ' ' + yen(s.amount) + '</title></circle>';
      offset += len;
    });
    svg += '<text x="' + cx + '" y="' + (cx - 6) + '" text-anchor="middle" class="donut-k">' + esc(label) + '</text>';
    svg += '<text x="' + cx + '" y="' + (cx + 16) + '" text-anchor="middle" class="donut-v">' + yen(total) + '</text></svg>';
    return svg;
  }

  /* ---- 支払い方法別 ---- */
  function methodSection(start, end) {
    var list = K.sumByMethod(S.tx, start, end, 'expense');
    var total = list.reduce(function (s, e) { return s + e.amount; }, 0);
    var html = '<section class="card"><div class="card-head"><h2>支払い方法別の支出</h2></div>';
    if (!total) return html + '<p class="muted">この期間の支出はありません。</p></section>';
    var pcts = K.sharePercents(list.map(function (e) { return e.amount; }), 1);
    var max = list[0].amount;
    html += '<ul class="rank plain">';
    list.forEach(function (e, i) {
      var m = methodOf(e.id) || { name: '未設定', icon: '・' };
      html += '<li><div class="rank-head"><span class="m-ic">' + esc(m.icon) + '</span><span class="name">' + esc(m.name) + '</span><span class="val">' + yen(e.amount) + '</span><span class="pct">' + pcts[i].toFixed(1) + '%</span></div>' +
        '<div class="hbar"><span class="accent" style="width:' + f1(e.amount / max * 100) + '%"></span></div></li>';
    });
    html += '</ul></section>';
    return html;
  }

  /* ---- 推移（縦棒グラフ＋表） ---- */
  function trendSection(title, series, pickKey, axisUnit) {
    var a = S.ui.ana;
    var sel = a[pickKey];
    if (sel === null || sel === undefined || sel >= series.length) sel = series.length - 1;
    if (pickKey === 'ypick') {
      var lastIdx = -1;
      series.forEach(function (s, i) { if (s.start <= S.today) lastIdx = i; });
      if (a.ypick === null || a.ypick === undefined) sel = lastIdx >= 0 ? lastIdx : 0;
    }
    var s = series[sel];
    var html = '<section class="card"><div class="card-head"><h2>' + esc(title) + '</h2></div>' +
      '<div class="chart-legend"><span>' + legendDot('income') + '収入</span><span>' + legendDot('expense') + '支出</span></div>' +
      '<div class="chart-box">' + columnsSVG(series, sel, pickKey, axisUnit) + '</div>' +
      '<div class="pick-line"><b>' + esc(s.long) + '</b><span class="income">収入 ' + yen(s.income) + '</span><span class="expense-t">支出 ' + yen(s.expense) + '</span><span class="' + (s.balance >= 0 ? 'pos' : 'neg') + '">収支 ' + yen(s.balance, true) + '</span></div>';
    html += '<details class="table-view"><summary>表で見る</summary><div class="table-wrap"><table class="num-table"><thead><tr><th>月</th><th>収入</th><th>支出</th><th>収支</th></tr></thead><tbody>';
    var ti = 0, te = 0;
    series.forEach(function (x, i) {
      ti += x.income; te += x.expense;
      html += '<tr' + (i === sel ? ' class="sel"' : '') + '><td>' + esc(x.long) + '</td><td>' + yen(x.income) + '</td><td>' + yen(x.expense) + '</td><td class="' + (x.balance >= 0 ? 'pos' : 'neg') + '">' + yen(x.balance, true) + '</td></tr>';
    });
    html += '<tr class="total"><td>合計</td><td>' + yen(ti) + '</td><td>' + yen(te) + '</td><td class="' + (ti - te >= 0 ? 'pos' : 'neg') + '">' + yen(ti - te, true) + '</td></tr>';
    html += '</tbody></table></div></details></section>';
    return html;
  }
  function barPath(x, yTop, w, h, cls) {
    if (h < 0.6) return '';
    var r = Math.min(4, w / 2, h);
    return '<path class="' + cls + '" d="M' + f1(x) + ',' + f1(yTop + h) + 'V' + f1(yTop + r) + 'Q' + f1(x) + ',' + f1(yTop) + ' ' + f1(x + r) + ',' + f1(yTop) +
      'H' + f1(x + w - r) + 'Q' + f1(x + w) + ',' + f1(yTop) + ' ' + f1(x + w) + ',' + f1(yTop + r) + 'V' + f1(yTop + h) + 'Z"/>';
  }
  function columnsSVG(series, sel, pickKey, axisUnit) {
    var W = contentWidth() - 32, H = 188, padL = 44, padR = 8, padT = 10, padB = 26;
    var max = 0;
    series.forEach(function (s) { max = Math.max(max, s.income, s.expense); });
    var step = K.niceStep(max || 10000, 4), top = Math.max(step, Math.ceil(max / step) * step);
    var plotW = W - padL - padR, plotH = H - padT - padB, n = series.length, slot = plotW / n;
    var barW = Math.max(3, Math.min(16, (slot - 8) / 2));
    var y = function (v) { return padT + plotH - (v / top) * plotH; };
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="収入と支出の推移">';
    for (var v = 0; v <= top + 0.001; v += step) {
      var yy = f1(y(v));
      svg += '<line class="' + (v === 0 ? 'base' : 'grid') + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '"/>';
      svg += '<text class="axis" x="' + (padL - 6) + '" y="' + f1(y(v) + 3.5) + '" text-anchor="end">' + K.axisYen(v) + '</text>';
    }
    series.forEach(function (s, i) {
      var cx = padL + slot * i + slot / 2, base = padT + plotH;
      svg += '<g class="col' + (i === sel ? ' sel' : '') + '" data-action="chart-pick" data-k="' + pickKey + '" data-i="' + i + '">';
      if (i === sel) svg += '<rect class="sel-bg" x="' + f1(cx - slot / 2 + 1) + '" y="' + padT + '" width="' + f1(slot - 2) + '" height="' + plotH + '" rx="6"/>';
      svg += barPath(cx - barW - 1, y(s.income), barW, base - y(s.income), 'bar-inc');
      svg += barPath(cx + 1, y(s.expense), barW, base - y(s.expense), 'bar-exp');
      svg += '<text class="axis' + (i === sel ? ' strong' : '') + '" x="' + f1(cx) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(s.label) + '</text>';
      svg += '<rect class="hit" x="' + f1(cx - slot / 2) + '" y="0" width="' + f1(slot) + '" height="' + H + '"/></g>';
    });
    svg += '</svg>';
    return svg;
  }
  function cumulativeSection(series) {
    var pts = [], acc = 0;
    series.forEach(function (s) { if (s.start <= S.today) { acc += s.balance; pts.push({ label: s.label, v: acc }); } });
    var html = '<section class="card"><div class="card-head"><h2>年間収支の推移（累計）</h2></div>';
    if (!pts.length) return html + '<p class="muted">まだデータがありません。</p></section>';
    var W = contentWidth() - 32, H = 160, padL = 44, padR = 12, padT = 12, padB = 24;
    var min = 0, max = 0;
    pts.forEach(function (p) { min = Math.min(min, p.v); max = Math.max(max, p.v); });
    var span = Math.max(max - min, 10000);
    var step = K.niceStep(span, 4);
    var lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
    if (hi === lo) hi = lo + step;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var x = function (i) { return padL + (12 > 1 ? plotW * i / 11 : 0); };
    var y = function (v) { return padT + plotH - (v - lo) / (hi - lo) * plotH; };
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="累計収支の推移">';
    for (var v = lo; v <= hi + 0.001; v += step) {
      svg += '<line class="' + (v === 0 ? 'base' : 'grid') + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + f1(y(v)) + '" y2="' + f1(y(v)) + '"/>';
      svg += '<text class="axis" x="' + (padL - 6) + '" y="' + f1(y(v) + 3.5) + '" text-anchor="end">' + K.axisYen(v) + '</text>';
    }
    var d = '', area = '';
    pts.forEach(function (p, i) { d += (i ? 'L' : 'M') + f1(x(i)) + ',' + f1(y(p.v)); });
    area = d + 'L' + f1(x(pts.length - 1)) + ',' + f1(y(Math.max(lo, Math.min(0, hi)))) + 'L' + f1(x(0)) + ',' + f1(y(Math.max(lo, Math.min(0, hi)))) + 'Z';
    svg += '<path class="area" d="' + area + '"/><path class="line" d="' + d + '"/>';
    var lp = pts[pts.length - 1];
    svg += '<circle class="dot" cx="' + f1(x(pts.length - 1)) + '" cy="' + f1(y(lp.v)) + '" r="4.5"/>';
    for (var i = 0; i < 12; i++) svg += '<text class="axis" x="' + f1(x(i)) + '" y="' + (H - 8) + '" text-anchor="middle">' + (i + 1) + '</text>';
    svg += '</svg>';
    html += '<div class="chart-box">' + svg + '</div><p class="pick-line"><b>' + esc(lp.label) + '月までの累計</b><span class="' + (lp.v >= 0 ? 'pos' : 'neg') + '">' + yen(lp.v, true) + '</span></p></section>';
    return html;
  }
  function yearsSection() {
    if (!S.tx.length) return '';
    var lab = S.settings.periodLabel;
    var firstY = K.periodLabelYM(K.periodKeyOf(S.tx[S.tx.length - 1].date, sd()), sd(), lab).y;
    var lastY = K.periodLabelYM(K.periodKeyOf(S.tx[0].date, sd()), sd(), lab).y;
    var curY = K.periodLabelYM(curPeriodKey(), sd(), lab).y;
    lastY = Math.max(lastY, curY);
    if (lastY - firstY > 9) firstY = lastY - 9;
    if (lastY === firstY) return '';
    var html = '<section class="card"><div class="card-head"><h2>年ごとの比較</h2></div><div class="table-wrap"><table class="num-table"><thead><tr><th>年</th><th>収入</th><th>支出</th><th>収支</th></tr></thead><tbody>';
    for (var yy = lastY; yy >= firstY; yy--) {
      var r = K.yearRange(yy, sd(), lab), s = K.summarize(S.tx, r.start, r.end);
      html += '<tr' + (yy === S.ui.ana.year ? ' class="sel"' : '') + '><td>' + yy + '年</td><td>' + yen(s.income) + '</td><td>' + yen(s.expense) + '</td><td class="' + (s.balance >= 0 ? 'pos' : 'neg') + '">' + yen(s.balance, true) + '</td></tr>';
    }
    return html + '</tbody></table></div></section>';
  }
  function dailySection(from, to) {
    var daily = K.dailyTotals(S.tx, from, to);
    var days = [];
    for (var d = from; d <= to; d = K.addDays(d, 1)) days.push({ date: d, v: daily[d] ? daily[d].expense : 0 });
    var W = contentWidth() - 32, H = 150, padL = 44, padR = 6, padT = 10, padB = 22;
    var max = 0;
    days.forEach(function (x) { max = Math.max(max, x.v); });
    var html = '<section class="card"><div class="card-head"><h2>日ごとの支出</h2></div>';
    if (!max) return html + '<p class="muted">この期間の支出はありません。</p></section>';
    var step = K.niceStep(max, 3), top = Math.ceil(max / step) * step;
    var plotW = W - padL - padR, plotH = H - padT - padB, slot = plotW / days.length;
    var bw = Math.max(1.5, Math.min(14, slot - 2));
    var y = function (v) { return padT + plotH - v / top * plotH; };
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="日ごとの支出">';
    for (var v = 0; v <= top + 0.001; v += step) {
      svg += '<line class="' + (v === 0 ? 'base' : 'grid') + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + f1(y(v)) + '" y2="' + f1(y(v)) + '"/><text class="axis" x="' + (padL - 6) + '" y="' + f1(y(v) + 3.5) + '" text-anchor="end">' + K.axisYen(v) + '</text>';
    }
    var labelEvery = Math.ceil(days.length / 7);
    days.forEach(function (x, i) {
      var cx = padL + slot * i + slot / 2;
      svg += barPath(cx - bw / 2, y(x.v), bw, padT + plotH - y(x.v), 'bar-exp') .replace('<path', '<path data-action="day-jump" data-date="' + x.date + '"');
      if (i % labelEvery === 0) svg += '<text class="axis" x="' + f1(cx) + '" y="' + (H - 6) + '" text-anchor="middle">' + K.formatDateShort(x.date) + '</text>';
    });
    svg += '</svg>';
    var peak = days.reduce(function (m, x) { return x.v > m.v ? x : m; }, days[0]);
    html += '<div class="chart-box">' + svg + '</div><p class="pick-line"><b>最も多い日</b><span>' + esc(K.formatDateJa(peak.date)) + ' ' + yen(peak.v) + '</span></p></section>';
    return html;
  }

  /* ================= サブ画面（ページ） ================= */
  var pageStack = [];
